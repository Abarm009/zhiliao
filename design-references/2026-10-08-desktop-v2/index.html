<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知了 · 石墨桌面交互 v2</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="designbar"><span><b>交互设计原型</b>　示例数据 · 未连接业务服务</span><div><label for="scene">查看场景</label><select id="scene"><option value="appointment">预约待确认</option><option value="progress">处置与证据阻断</option><option value="acceptance">独立验收 / 退回</option><option value="empty">无可见任务</option></select><button id="reset" class="plain">重置演示</button></div></div>
<div class="app">
<header class="appbar"><a href="#" class="brand" aria-label="知了首页"><svg viewBox="0 0 32 32" fill="none"><path d="M8 10c0-4 16-4 16 0v12c0 4-16 4-16 0V10Z" stroke="currentColor" stroke-width="2"/><path d="M8 16c0 4 16 4 16 0M8 10c0 4 16 4 16 0" stroke="currentColor" stroke-width="2"/></svg><span>知了<span class="brand-sub">维修协作</span></span></a><div class="project-label">项目 A <span>/</span> 维修任务</div><div class="header-actions"><button class="plain mobile-tasks" id="list-toggle">任务列表</button><button class="plain" id="help" aria-label="使用说明">使用说明</button><button class="profile" id="profile"><span class="avatar" id="avatar">报</span><span><b id="profile-name">报修人一</b><small id="profile-role">报修人</small></span><span class="chevron">⌄</span></button></div></header>
<div class="workspace">
<nav class="sidebar" aria-label="主导航"><div><p class="nav-label">工作空间</p><button data-nav="all" aria-label="我的任务" class="nav-item active"><span class="nav-icon">▤</span><span>我的任务</span><b id="count-all">0</b></button><button data-nav="todo" aria-label="待我处理" class="nav-item"><span class="nav-icon">◷</span><span>待我处理</span><b id="count-todo">0</b></button><button data-nav="favorite" aria-label="收藏任务" class="nav-item"><span class="nav-icon">☆</span><span>收藏任务</span><b id="count-favorite">0</b></button></div><div class="sidebar-bottom"><div class="project-note"><span class="dot"></span> 项目 A<small>任务协作工作空间</small></div><button id="settings" class="nav-item" aria-label="设置与演示身份"><span class="nav-icon">⚙</span><span>设置与演示身份</span></button></div></nav>
<section class="list-panel" aria-label="任务列表"><div class="list-head"><div><h1 id="list-title">我的任务</h1><span id="list-count">0 项任务</span></div><button class="icon-btn" id="new-task" aria-label="新建报修">＋</button></div><label class="search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8"/></svg><input id="search" type="search" placeholder="搜索问题、设备或任务号" aria-label="搜索任务"><kbd>⌘ K</kbd></label><div class="filters" aria-label="状态筛选"><button data-filter="all" class="active">全部</button><button data-filter="active">处理中</button><button data-filter="done">已结束</button></div><div id="tasks" class="task-list"></div><div class="list-footer"><span id="scope-note">仅显示当前身份可见的任务</span></div></section>
<main class="canvas" id="main"><section class="detail" id="detail" aria-label="任务详情"></section><aside class="action-panel" id="action-panel" aria-label="下一步操作"></aside></main>
</div>
<footer class="statusbar"><span><span class="dot"></span> 本页交互演示</span><span>未连接业务服务 · 刷新后重置示例数据</span><span>⌘ K 搜索　Esc 关闭面板</span></footer>
</div>
<dialog id="modal" class="modal" aria-labelledby="dialog-title"><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body></html>
