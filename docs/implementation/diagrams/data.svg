<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img" aria-label="图 5 · 数据关系与事实归属"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60798a"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183447}.title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:650}.line{font-size:16px}.edge{fill:none;stroke:#60798a;stroke-width:2;marker-end:url(#arrow)}.sub{font-size:16px;fill:#617685}</style><rect width="1400" height="990" fill="#fcfdfd"/><text x="42" y="49" class="title">图 5 · 数据关系与事实归属</text><text x="42" y="79" class="sub">待实现设计 · 虚线表示宿主待验证或外部预留 · 本地业务状态真实持久化</text><rect x="40" y="135" width="410" height="195" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="60" y="167" class="head">身份与目录</text><text x="60" y="198" class="line">org / project / user / roles / skills</text><text x="60" y="223" class="line">space / asset / asset_serves</text><text x="60" y="248" class="line">设备安装位置与服务空间分开</text><text x="60" y="273" class="line">来源：DEMO / LOCAL_IMPORT / 外部快照</text><rect x="490" y="135" width="420" height="195" rx="14" fill="#e9f5ef" stroke="#8ba8b8" stroke-width="1.5"/><text x="510" y="167" class="head">repair_tasks · 本地业务权威</text><text x="510" y="198" class="line">本地 task_id / task_no / version</text><text x="510" y="223" class="line">reporter / assignee / asset / space</text><text x="510" y="248" class="line">状态机与独立 external_sync_state</text><text x="510" y="273" class="line">P0 authority_mode = LOCAL</text><rect x="950" y="135" width="410" height="195" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="970" y="167" class="head">repair_actions + repair_events</text><text x="970" y="198" class="line">org + actor + idempotency_key 唯一</text><text x="970" y="223" class="line">请求摘要 / 原回执 / 预期版本</text><text x="970" y="248" class="line">任务动作与事件同事务提交</text><text x="970" y="273" class="line">event.seq ≠ task.version</text><rect x="40" y="415" width="410" height="195" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="60" y="447" class="head">repair_appointments</text><text x="60" y="478" class="line">任务 → 多轮提议与确认</text><text x="60" y="503" class="line">同任务最多一份有效提议/确认</text><text x="60" y="528" class="line">同技工跨项目确认预约不重叠</text><text x="60" y="553" class="line">改约成功后替换旧预约</text><rect x="490" y="415" width="420" height="195" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="510" y="447" class="head">处置与验收证据</text><text x="510" y="478" class="line">progress / completions</text><text x="510" y="503" class="line">attachments / completion_attachments</text><text x="510" y="528" class="line">acceptances：通过 / 退回 / 代验收</text><text x="510" y="553" class="line">不同任务附件不能互相引用</text><rect x="950" y="415" width="410" height="195" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="970" y="447" class="head">作业与用户视图</text><text x="970" y="478" class="line">jobs：租约、到期、重试、去重</text><text x="970" y="503" class="line">notifications：事件+收件人+类型唯一</text><text x="970" y="528" class="line">pins：用户+任务唯一</text><text x="970" y="553" class="line">派生投影由后端按角色生成</text><rect x="40" y="740" width="410" height="160" rx="14" fill="#eef1ff" stroke="#8ba8b8" stroke-width="1.5"/><text x="60" y="772" class="head">模型运行记录</text><text x="60" y="803" class="line">agent_runs：任务基础版本、模型版本</text><text x="60" y="828" class="line">结果只为建议，不改任务事实</text><text x="60" y="853" class="line">会话JSONL用于排障，不是事务库</text><rect x="490" y="740" width="420" height="160" rx="14" fill="#f2f3f4" stroke="#8ba8b8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="510" y="772" class="head">外部写入预留</text><text x="510" y="803" class="line">external_exports：相关ID、输出版本</text><text x="510" y="828" class="line">默认NOT_CONFIGURED / external_id=null</text><text x="510" y="853" class="line">不自动创建第二个外部事实源</text><rect x="950" y="740" width="410" height="160" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="970" y="772" class="head">会话与配对</text><text x="970" y="803" class="line">auth_sessions / host_pairings</text><text x="970" y="828" class="line">host_sessions：实例绑定、到期、撤销</text><text x="970" y="853" class="line">数据库仅存凭据哈希</text><path class="edge" d="M450 235 H490"/><path class="edge" d="M910 235 H950"/><path class="edge" d="M620 330 V373 H245 V415"/><path class="edge" d="M700 330 V415"/><path class="edge" d="M800 330 V373 H1155 V415"/><path class="edge" d="M620 610 V666 H245 V740"/><path class="edge" d="M700 610 V740"/><text x="40" y="954" class="sub">schema.sql是可执行参考结构；角色权限、业务状态、附件真实性仍须应用层校验。所有模块为设计目标。</text></svg>