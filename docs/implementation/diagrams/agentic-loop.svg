bd5"/><text x="1228" y="417" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#183447" font-weight="700">④ 建议与IntentSpec</text><text x="1228" y="447" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">结构化字段 / 引用 / 缺失项</text><text x="1228" y="474" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">建议命令与基础任务版本</text><text x="1228" y="501" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">不写业务事实、不替人批准</text><path d="M390 461 L430 461" stroke="#497b86" stroke-width="2" fill="none"/><path d="M423 456 L430 461 L423 466" fill="none" stroke="#497b86" stroke-width="2"/><path d="M780 461 L820 461" stroke="#497b86" stroke-width="2" fill="none"/><path d="M813 456 L820 461 L813 466" fill="none" stroke="#497b86" stroke-width="2"/><path d="M1170 461 L1210 461" stroke="#497b86" stroke-width="2" fill="none"/><path d="M1203 456 L1210 461 L1203 466" fill="none" stroke="#497b86" stroke-width="2"/><text x="40" y="577" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#183447" font-weight="400">⑤ 校验后回到同一原生卡片：显示来源、补充歧义、核对具体动作；过期建议不得继续执行</text><path d="M1385 535 L1385 565" stroke="#497b86" stroke-width="2" fill="none"/><path d="M1380 558 L1385 565 L1390 558" fill="none" stroke="#497b86" stroke-width="2"/><rect x="40" y="620" width="350" height="160" rx="12" fill="#fff4dd" stroke="#b6cbd5"/><text x="58" y="652" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#183447" font-weight="700">⑥ 用户确认具体动作</text><text x="58" y="682" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">固定界面片段和数据绑定</text><text x="58" y="709" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">不动态加载任意脚本或URL</text><text x="58" y="736" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">grant + 后端角色共同核验</text><rect x="430" y="620" width="350" height="160" rx="12" fill="#edf4f8" stroke="#b6cbd5"/><text x="448" y="652" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#183447" font-weight="700">⑦ 统一命令执行</text><text x="448" y="682" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">身份 / 状态 / 版本 / 幂等</text><text x="448" y="709" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">预约冲突与证据归属校验</text><text x="448" y="736" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">单事务保存回执和事件</text><rect x="820" y="620" width="350" height="160" rx="12" fill="#e6f2ec" stroke="#b6cbd5"/><text x="838" y="652" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#183447" font-weight="700">⑧ 独立结果核验</text><text x="838" y="682" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">读取动作版本与不可变事件</text><text x="838" y="709" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">更高版本不误判旧动作</text><text x="838" y="736" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">回读失败保留待核验状态</text><rect x="1210" y="620" width="350" height="160" rx="12" fill="#e6f2ec" stroke="#b6cbd5"/><text x="1228" y="652" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#183447" font-weight="700">⑨ 同卡更新与独立验收</text><text x="1228" y="682" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">最新任务投影来自数据库</text><text x="1228" y="709" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">完工 ≠ 已验收完成</text><text x="1228" y="736" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">验收人不能为当前承接者</text><path d="M390 700 L430 700" stroke="#497b86" stroke-width="2" fill="none"/><path d="M423 695 L430 700 L423 705" fill="none" stroke="#497b86" stroke-width="2"/><path d="M780 700 L820 700" stroke="#497b86" stroke-width="2" fill="none"/><path d="M813 695 L820 700 L813 705" fill="none" stroke="#497b86" stroke-width="2"/><path d="M1170 700 L1210 700" stroke="#497b86" stroke-width="2" fill="none"/><path d="M1203 695 L1210 700 L1203 705" fill="none" stroke="#497b86" stroke-width="2"/><rect x="40" y="830" width="1520" height="145" rx="12" fill="#e9f1f5" stroke="#b6cbd5"/><text x="60" y="866" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#183447" font-weight="700">事实与存储边界</text><text x="60" y="901" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#183447" font-weight="400">runtime/repair.db：本地任务唯一权威；旧历史显式导入并保留来源；模型日志不能代替事务记录</text><text x="60" y="934" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#183447" font-weight="400">外部工单：默认 NOT_CONFIGURED；Matrix只分享任务入口，不复制授权、不成为另一套任务数据库</text><path d="M605 780 L605 830" stroke="#497b86" stroke-width="2" fill="none"/><path d="M600 823 L605 830 L610 823" fill="none" stroke="#497b86" stroke-width="2"/><path d="M995 780 L995 830" stroke="#497b86" stroke-width="2" fill="none"/><path d="M990 823 L995 830 L1000 823" fill="none" stroke="#497b86" stroke-width="2"/><rect x="40" y="1010" width="1520" height="184" rx="12" fill="#fff4dd" stroke="#b6cbd5"/><text x="60" y="1046" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#183447" font-weight="700">C  可复现评测与比赛门槛</text><text x="60" y="1080" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#183447" font-weight="400">冻结输入、合成数据、模型、提示词、工具权限、宿主与源码版本；保存成功 / 拒绝 / 失败 / 恢复证据</text><text x="60" y="1114" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#183447" font-weight="400">初赛原始材料未把Rust或ROM开发设为门槛；原生宿主和本地Python服务的实际接入仍必须过G0</text><text x="60" y="1148" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#183447" font-weight="400">主路径：Rust宿主 + Python业务核心。正式规则若要求业务全Rust，按相同契约定向移植，不双写</text><text x="40" y="1230" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#183447" font-weight="400">对应文档：07_REVISION_20260926.md · 08_REUSE_MIGRATION.md · 09_AGENT_HARNESS.md</text></svg>