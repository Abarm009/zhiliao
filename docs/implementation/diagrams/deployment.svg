<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-label="图 4 · 部署与信任边界"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60798a"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183447}.title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:650}.line{font-size:16px}.edge{fill:none;stroke:#60798a;stroke-width:2;marker-end:url(#arrow)}.sub{font-size:16px;fill:#617685}</style><rect width="1400" height="960" fill="#fcfdfd"/><text x="42" y="49" class="title">图 4 · 部署与信任边界</text><text x="42" y="79" class="sub">待实现设计 · 虚线表示宿主待验证或外部预留 · 本地业务状态真实持久化</text><rect x="24" y="106" width="1030" height="805" rx="20" fill="#f6f9fb" stroke="#c6d7e0"/><text x="47" y="140" class="head">同一台开发/演示桌面机器 · 默认仅 loopback</text><rect x="50" y="165" width="465" height="205" rx="14" fill="#fff5dc" stroke="#8ba8b8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="70" y="197" class="head">robrix2 原生宿主（需扩展构建）</text><text x="70" y="228" class="line">固定 app_id / version / digest</text><text x="70" y="253" class="line">Rust + Makepad + Octoscript L0</text><text x="70" y="278" class="line">原生控件 → 受控权限 broker</text><text x="70" y="303" class="line">脚本不持有账号、后端或模型密钥</text><rect x="565" y="165" width="465" height="205" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="585" y="197" class="head">Web 回归与配对管理页</text><text x="585" y="228" class="line">TypeScript / Vite → 同源静态文件</text><text x="585" y="253" class="line">独立演示账号会话 + CSRF</text><text x="585" y="278" class="line">审批本次本地宿主配对</text><text x="585" y="303" class="line">普通网页成功 ≠ 原生宿主验收成功</text><rect x="50" y="445" width="980" height="190" rx="14" fill="#edf5fa" stroke="#8ba8b8" stroke-width="1.5"/><text x="70" y="477" class="head">FastAPI 模块化单进程后端 · 127.0.0.1:8711</text><text x="70" y="508" class="line">/api/tasks/v1 → 会话 / 项目 / 角色 → 任务与预约服务 → 统一命令执行</text><text x="70" y="533" class="line">HTTP 回执 + 投影回读；SSE / 原生版本轮询负责界面刷新</text><text x="70" y="558" class="line">数据库作业：短时模型运行、提议到期、站内提醒；写入同一执行边界</text><text x="70" y="583" class="line">WAGENT_MODE=contest：禁用尚未迁移的旧写路由、MCP 写工具及 reset</text><path class="edge" d="M282 370 V445"/><text x="85" y="413" class="sub">Bearer 仅由 broker 持有</text><path class="edge" d="M798 370 V445"/><text x="650" y="413" class="sub">同源 cookie / CSRF</text><rect x="50" y="700" width="465" height="155" rx="14" fill="#e9f5ef" stroke="#8ba8b8" stroke-width="1.5"/><text x="70" y="732" class="head">runtime/repair.db</text><text x="70" y="763" class="line">repair_* 任务 / 预约 / 回执 / 事件</text><text x="70" y="788" class="line">幂等、版本、同技工冲突、持久化作业</text><text x="70" y="813" class="line">参考 schema.sql；通过版本迁移安装</text><rect x="565" y="700" width="465" height="155" rx="14" fill="#e9f5ef" stroke="#8ba8b8" stroke-width="1.5"/><text x="585" y="732" class="head">runtime/attachments 与会话日志</text><text x="585" y="763" class="line">证据文件：按任务鉴权后下载</text><text x="585" y="788" class="line">JSONL：模型排障，不替代业务事务</text><text x="585" y="813" class="line">旧 ops.db 仅隔离回归，不双写</text><path class="edge" d="M282 635 V700"/><path class="edge" d="M798 635 V700"/><rect x="1080" y="200" width="290" height="185" rx="14" fill="#eef1ff" stroke="#8ba8b8" stroke-width="1.5"/><text x="1100" y="232" class="head">真实模型服务</text><text x="1100" y="263" class="line">兼容模型端点</text><text x="1100" y="288" class="line">key 仅后端持有</text><text x="1100" y="313" class="line">有用量与错误记录</text><text x="1100" y="338" class="line">假模型仅离线测试</text><path class="edge" d="M1030 510 H1058 V293 H1080"/><rect x="1080" y="550" width="290" height="210" rx="14" fill="#f2f3f4" stroke="#8ba8b8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1100" y="582" class="head">外部工单（预留）</text><text x="1100" y="613" class="line">DisabledConnector</text><text x="1100" y="638" class="line">NOT_CONFIGURED</text><text x="1100" y="663" class="line">无外部单号</text><text x="1100" y="688" class="line">无假成功 / 无真实投递</text><text x="1100" y="713" class="line">未来：回执 + 结果核对</text><path class="edge" d="M1030 575 H1080"/><text x="50" y="942" class="sub">G0须验证真实原生构建、配对、授权、一次读写回读与撤权；不承诺远端认证、手机或OS级桌面组件。</text></svg>