[project]
name = "wagent-backend"
version = "0.3.0"
description = "WAgent 设备台账知识图谱服务：graphRAG 图谱核心 + LLM 工具 + Web 可视化（图谱会自己长大）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "mcp>=1.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "openai>=1.40",
    "python-multipart>=0.0.9",
]

[project.scripts]
kg-web = "wagent_backend.web.app:main"
kg-demo = "wagent_backend.tools.demo:main"
kg-mcp = "wagent_backend.tools.mcp_server:main"
ops-mcp = "wagent_backend.ops.tools.mcp:main"

[dependency-groups]
dev = ["pytest>=8.0", "anyio>=4.4", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagent_backend"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
